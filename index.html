const THIRD_SPACES = {"type": "FeatureCollection", "features": [{"type": "Feature", "geometry": {"type": "Point", "coordinates": [-111.901075, 40.762372]}, "properties": {"name": "Greek Orthodox Church", "category": "church", "note": "Rev. L. Parthenios Limperopoulos, Pastor", "address": "439 W 4th South"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-111.903461, 40.765986]}, "properties": {"name": "Greek Community of Utah", "category": "civic", "note": "N. P. Stathakos, Pres.; Andrew Papas, Sec.", "address": "539 W 2nd South"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-111.897711, 40.765986]}, "properties": {"name": "Italian-Greek Mercantile Co", "category": "store", "note": "Grocery/mercantile; Evaggelos & Louis Skliris, Gust Economy", "address": "298 W 2d South"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-111.903652, 40.765986]}, "properties": {"name": "Greek-American Grocery Co", "category": "store", "note": "James & Peter Nickic, Gust Travis", "address": "547 W 2d South"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-111.903509, 40.765986]}, "properties": {"name": "Jaros & Tuluskost Restaurant", "category": "restaurant", "note": "Christ Jaros, Nicholas Tuluskost, partners", "address": "541 W 2d South"}}]};
const RAIL_LINES = {"type": "FeatureCollection", "features": [{"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[-111.8906, 40.7696], [-111.895, 40.72], [-111.8879, 40.6669]]}, "properties": {"name": "Utah Light & Railway (streetcar to Murray)", "mode": "streetcar", "approximate": true}}, {"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[-111.8906, 40.7696], [-111.98, 40.75], [-112.1572, 40.7261], [-112.21, 40.735]]}, "properties": {"name": "Salt Lake & Los Angeles Railway (to Garfield/Saltair)", "mode": "interurban", "approximate": true}}, {"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[-112.1572, 40.7261], [-112.13, 40.62], [-112.1497, 40.5178]]}, "properties": {"name": "Copper Belt Railroad (Bingham ore line via Garfield)", "mode": "steam_freight", "approximate": true}}, {"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[-111.89, 40.82], [-111.9065, 40.7584], [-111.8879, 40.6669], [-111.8389, 40.5649]]}, "properties": {"name": "Denver & Rio Grande main line", "mode": "steam_rail", "approximate": true}}, {"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[-111.9, 40.82], [-111.9028, 40.7721], [-111.9391, 40.6097]]}, "properties": {"name": "Oregon Short Line main line", "mode": "steam_rail", "approximate": true}}]};

const map = L.map('map', { zoomControl: true });

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri. Historical reconstruction: 1909 Greek-immigrant settlement data, Salt Lake City directory project.'
}).addTo(map);

// 1911 Sanborn Fire Insurance Map, Salt Lake City, sheet 121 -- covers the
// block bounded by 1st South/2nd South and 5th West/4th West, i.e. the
// Greek Town business cluster (Italian-Greek Merc Co "298 W 2d South",
// Greek-American Grocery Co "547 W 2d South", Jaros & Tuluskost restaurant
// "541 W 2d South"). Confirmed as the correct sheet by cross-checking the
// building addresses printed on its own 1st South frontage (501W-579W,
// matching the 500s address range) -- an earlier attempt used sheet 120 (the
// 5th-6th West block), which turned out to be the adjacent D&RG/Bamberger
// Coal rail yard, not the retail block. Bounds hand-georeferenced against
// this project's own SLC grid math using the sheet's printed street labels
// as control points -- approximate (measured pixel positions), not
// survey-grade registration.
const sanbornBounds = [[40.764107, -111.905493], [40.767243, -111.902132]];
const sanbornOverlay = L.imageOverlay('assets/sanborn_sheet_121.jpg', sanbornBounds, {
  opacity: 0.85,
  attribution: 'Sanborn Map Company, "Salt Lake City, Utah," 1911, sheet 121 -- J. Willard Marriott Library, University of Utah (Sanborn Fire Insurance Maps collection), CC0 public domain. Overlay georeferencing by this project, approximate.'
});

function circleMarker(feature, latlng, color, radius) {
  return L.circleMarker(latlng, {
    radius: radius || 5, color: '#222', weight: 1, fillColor: color, fillOpacity: 0.85
  });
}

function popupHtml(props, extraRows) {
  let rows = extraRows || [];
  return '<b>' + (props.name || '') + '</b><br>' + rows.map(r => r).join('<br>');
}

function clusterIconFactory(extraClass) {
  return function(cluster) {
    const count = cluster.getChildCount();
    const size = Math.min(60, 22 + Math.sqrt(count) * 4);
    return L.divIcon({
      html: '<span>' + count + '</span>',
      className: 'cluster-icon' + (extraClass ? ' ' + extraClass : ''),
      iconSize: [size, size]
    });
  };
}

const livedLayer = L.markerClusterGroup({
  maxClusterRadius: 45,
  iconCreateFunction: clusterIconFactory('')
});
L.geoJSON(LIVED, {
  pointToLayer: (f, latlng) => circleMarker(f, latlng, '#2b6cb0', 5),
  onEachFeature: (f, layer) => layer.bindPopup(popupHtml(f.properties, [
    f.properties.occupation || '', f.properties.address || '',
    '<i>' + f.properties.gender + ' &middot; ' + f.properties.precision + '</i>'
  ]))
}).eachLayer(l => livedLayer.addLayer(l));

const workedLayer = L.markerClusterGroup({
  maxClusterRadius: 45,
  iconCreateFunction: clusterIconFactory('worked')
});
L.geoJSON(WORKED, {
  pointToLayer: (f, latlng) => circleMarker(f, latlng, '#dd6b20', 5),
  onEachFeature: (f, layer) => layer.bindPopup(popupHtml(f.properties, [
    f.properties.occupation || '', f.properties.company || '',
    '<i>' + f.properties.gender + ' &middot; ' + f.properties.precision + '</i>'
  ]))
}).eachLayer(l => workedLayer.addLayer(l));

const thirdSpaceColors = { church: '#805ad5', civic: '#319795', store: '#d69e2e', restaurant: '#e53e3e' };
const thirdSpacesLayer = L.geoJSON(THIRD_SPACES, {
  pointToLayer: (f, latlng) => circleMarker(f, latlng, thirdSpaceColors[f.properties.category] || '#444', 8),
  onEachFeature: (f, layer) => layer.bindPopup(popupHtml(f.properties, [
    '<i>' + f.properties.category + '</i>', f.properties.note || '', f.properties.address || ''
  ]))
});

const railColors = { streetcar: '#2f855a', interurban: '#2f855a', steam_freight: '#975a16', steam_rail: '#975a16' };
const railLinesLayer = L.geoJSON(RAIL_LINES, {
  style: (f) => ({
    color: railColors[f.properties.mode] || '#555',
    weight: f.properties.mode.includes('steam') ? 3 : 4,
    dashArray: f.properties.mode.includes('steam') ? '2,6' : null,
    opacity: 0.8
  }),
  onEachFeature: (f, layer) => layer.bindPopup('<b>' + f.properties.name + '</b><br><i>schematic / approximate route</i>')
});

railLinesLayer.addTo(map);
thirdSpacesLayer.addTo(map);
workedLayer.addTo(map);
livedLayer.addTo(map);

const allPoints = L.featureGroup([livedLayer, workedLayer, thirdSpacesLayer]);
map.fitBounds(allPoints.getBounds().pad(0.08));

const legend = L.control({ position: 'topright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML =
    '<h3>Greeks of 1909 Salt Lake Valley</h3>' +
    '<label><input type="checkbox" id="toggle-lived" checked> <span class="swatch" style="background:#2b6cb0"></span>Where they lived (' + LIVED.features.length + ')</label>' +
    '<label><input type="checkbox" id="toggle-worked" checked> <span class="swatch" style="background:#dd6b20"></span>Where they worked (' + WORKED.features.length + ')</label>' +
    '<label><input type="checkbox" id="toggle-third" checked> <span class="swatch" style="background:#805ad5"></span>Third spaces: church, stores, civic (' + THIRD_SPACES.features.length + ')</label>' +
    '<label><input type="checkbox" id="toggle-rail" checked> <span class="line-swatch" style="background:#2f855a"></span>Rail / streetcar lines (' + RAIL_LINES.features.length + ')</label>' +
    '<label><input type="checkbox" id="toggle-sanborn"> <span class="swatch" style="background:#b7791f;border-radius:2px"></span>1911 Sanborn inset: Greek Town block</label>' +
    '<div class="note">Addresses geocoded from the 1909 directory using Salt Lake\'s numbered-street grid -- block-level approximation, not survey-grade. Rail/streetcar routes are schematic waypoint lines, not digitized track alignments. Base map is modern Esri street tiles; no single period map covers the whole valley at this scale, so the 1911 Sanborn sheet is shown only as a downtown inset (its own registration is approximate, hand-fit to this project\'s street grid).</div>';
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);

document.getElementById('toggle-lived').addEventListener('change', (e) => {
  if (e.target.checked) livedLayer.addTo(map); else map.removeLayer(livedLayer);
});
document.getElementById('toggle-worked').addEventListener('change', (e) => {
  if (e.target.checked) workedLayer.addTo(map); else map.removeLayer(workedLayer);
});
document.getElementById('toggle-third').addEventListener('change', (e) => {
  if (e.target.checked) thirdSpacesLayer.addTo(map); else map.removeLayer(thirdSpacesLayer);
});
document.getElementById('toggle-rail').addEventListener('change', (e) => {
  if (e.target.checked) railLinesLayer.addTo(map); else map.removeLayer(railLinesLayer);
});
document.getElementById('toggle-sanborn').addEventListener('change', (e) => {
  if (e.target.checked) {
    sanbornOverlay.addTo(map);
    sanbornOverlay.bringToBack();
    map.fitBounds(sanbornBounds);
  } else {
    map.removeLayer(sanbornOverlay);
  }
});
</script>
